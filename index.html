<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industry City & Beyond | Pure Beauty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAFAFA;
            --text-main: #1C1C1C;
            --text-muted: #6B6B6B;
            --accent: #D4AF37; /* Subtle elegant gold */
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overscroll-behavior: none;
        }
        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }
        .smooth-scroll-wrapper {
            width: 100%;
            overflow: hidden;
        }
        
        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 0 2rem;
        }
        .hero h1 {
            font-size: clamp(3rem, 8vw, 7rem);
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }
        .hero p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            max-width: 600px;
            font-weight: 300;
        }

        /* Image Composite Effect */
        .image-composite {
            position: relative;
            width: 100%;
            height: 60vh;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            cursor: pointer;
        }
        .image-generated-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            filter: blur(20px) saturate(1.5);
            opacity: 0;
            transition: opacity 0.8s ease, transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            transform: scale(1.1);
        }
        .image-composite:hover .image-generated-layer {
            opacity: 0.8;
            transform: scale(1);
        }
        .image-original-layer {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 2;
        }
        .image-composite:hover .image-original-layer {
            transform: translate(-50%, -50%) scale(1.03);
        }

        /* Itinerary Section */
        .itinerary-item {
            display: flex;
            flex-direction: column;
            gap: 4rem;
            padding: 8rem 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        @media(min-width: 1024px) {
            .itinerary-item {
                flex-direction: row;
                align-items: center;
                gap: 8rem;
            }
            .itinerary-item:nth-child(even) {
                flex-direction: row-reverse;
            }
        }
        .item-content {
            flex: 1;
            padding: 0 2rem;
        }
        .item-content h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .item-content .time {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 1rem;
            display: block;
        }
        .item-images {
            flex: 1.2;
            padding: 0 2rem;
            perspective: 1000px;
        }

        .venue-card {
            margin-top: 2rem;
            background: #fff;
            padding: 1.5rem;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border-left: 2px solid var(--accent);
            transition: transform 0.4s ease;
        }
        .venue-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

<div class="smooth-scroll-wrapper" id="smooth-wrapper">
    <div id="smooth-content">

        <!-- HERO -->
        <section class="hero overflow-hidden relative min-h-screen flex items-center justify-center pt-16" id="hero">
            <!-- GSAP Floating Parallax Images (RESTORED TO PRE-HEART WORKFLOW) -->
            <div id="hero-gallery" class="absolute inset-0 w-full h-full z-0 overflow-visible pointer-events-none">
                <img src="images/friends/14527096-E46D-48E6-8D9C-6E2F42562F15.JPG" class="hero-float-img absolute rounded-xl shadow-[0_30px_60px_rgba(0,0,0,0.15)] will-change-transform w-28 md:w-56 top-[15%] left-[5%] md:left-[10%] object-cover object-center" data-speed="1.4" alt="Memory" />
                <img src="images/friends/546602C0-8686-44BD-BEED-F45064C63A8E.JPG" class="hero-float-img absolute rounded-xl shadow-[0_30px_60px_rgba(0,0,0,0.15)] will-change-transform w-24 md:w-48 top-[10%] right-[5%] md:right-[15%] object-cover object-center" data-speed="-1.0" alt="Memory" />
                <img src="images/friends/54AE4B5F-B1C4-4B7C-9B3D-C768AF1FB056.JPG" class="hero-float-img absolute rounded-xl shadow-[0_30px_60px_rgba(0,0,0,0.15)] will-change-transform w-32 md:w-64 bottom-[15%] right-[10%] md:right-[5%] object-cover object-center" data-speed="1.2" alt="Memory" />
                <img src="images/friends/87AFF53C-3206-4A59-9010-8C50B5828E62.JPG" class="hero-float-img absolute rounded-xl shadow-[0_30px_60px_rgba(0,0,0,0.15)] will-change-transform w-28 md:w-60 bottom-[20%] left-[8%] md:left-[12%] object-cover object-center" data-speed="-0.7" alt="Memory" />
                <img src="images/friends/IMG_7934.jpg" class="hero-float-img absolute rounded-xl shadow-[0_30px_60px_rgba(0,0,0,0.15)] will-change-transform w-32 md:w-72 bottom-[5%] left-[50%] -translate-x-1/2 md:translate-x-0 md:left-auto md:bottom-[20%] md:right-[35%] object-cover object-center" data-speed="1.5" alt="Memory" />
            </div>

            <!-- Foreground Content -->
            <div class="z-20 relative pointer-events-auto flex flex-col items-center justify-center w-full max-w-5xl gap-6">
                
                <!-- SVG Animated Filter for Fire -->
                <svg width="0" height="0" class="absolute pointer-events-none">
                    <filter id="fire">
                        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.04" numOctaves="3" result="noise">
                            <animate attributeName="baseFrequency" values="0.02 0.04;0.01 0.08;0.02 0.04" dur="3s" repeatCount="indefinite" />
                        </feTurbulence>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
                    </filter>
                </svg>

                <!-- Fun & Friends (Original Black Font) -->
                <h1 class="hero-title font-serif text-stone-900 text-6xl md:text-8xl lg:text-[7rem] font-semibold tracking-tight text-center drop-shadow-sm z-10 w-full" style="font-family: 'Playfair Display', serif;">
                    Fun &amp; Friends
                </h1>

                <!-- Heart In Between -->
                <div id="sacred-heart-container" class="relative w-48 h-48 md:w-64 md:h-64 flex justify-center items-center z-10" style="transform-style: preserve-3d; transition: transform 0.1s ease-out;">
                    <img src="images/sacred_heart_final_2.png" alt="Sacred Heart" class="absolute inset-0 w-full h-full object-contain filter drop-shadow-[0_0_50px_rgba(255,60,0,0.6)]" style="transform: translateZ(50px);" />
                    <!-- Animated Fire Overlay -->
                    <div class="absolute inset-0 w-full h-full pointer-events-none" style="mask-image: linear-gradient(to bottom, black 0%, black 45%, transparent 55%); -webkit-mask-image: linear-gradient(to bottom, black 0%, black 45%, transparent 55%); transform: translateZ(80px);">
                        <img src="images/sacred_heart_final_2.png" class="w-full h-full object-contain filter drop-shadow-[0_0_20px_rgba(255,200,0,0.8)]" style="filter: url(#fire);" />
                    </div>
                </div>

                <!-- Industry City (Glossy Chrome CSS) -->
                <h2 class="hero-title text-center font-black tracking-tighter uppercase relative z-10 w-full" style="
                    font-family: 'Titan One', Impact, sans-serif;
                    font-size: clamp(3rem, 10vw, 8.5rem);
                    line-height: 1.1;
                    background: linear-gradient(180deg, #ffffff 0%, #e6e6e6 30%, #999999 48%, #222222 50%, #555555 52%, #dcdcdc 75%, #ffffff 100%);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    -webkit-text-stroke: 1.5px rgba(255,255,255,0.8);
                    filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.6)) drop-shadow(0px -2px 2px rgba(255,255,255,1));
                ">
                    Industry City
                </h2>
            </div>
        </section>

        <!-- ITINERARY CONTAINER -->
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 relative" id="itinerary-list">
            <!-- Content Injected via JS -->
        </section>

        <!-- Silly Surprise Section -->
        <div class="w-full h-screen bg-black flex justify-center items-center overflow-hidden relative" id="surprise-section">
            <img src="images/friends/18273F7C-1B6B-44A9-A290-378360EB1360.JPG" class="w-full h-full object-contain mix-blend-screen opacity-0" id="surprise-img" />
        </div>

        <footer class="py-24 text-center text-stone-400 text-sm bg-black">
            <p class="serif italic text-lg mb-2">"Pure Beauty in Every Detail"</p>
            <p>Saturfun &copy; 2026</p>
        </footer>

    </div>
</div>

<script>
    gsap.registerPlugin(ScrollTrigger);

    const itineraryData = [
        {
            time: "11:30 AM",
            title: "Coffee & Patisserie",
            description: "Begin the morning in a sunlit space with classic French-Belgian baked goods or Yemeni pour-over coffees.",
            places: [
                {
                    name: "Colson Patisserie",
                    desc: "Perfect quiet starting point before the crowds.",
                    url: "https://industrycity.com/tenants/colson-patisserie/",
                    originalPhoto: "images/colson_patisserie_1774058351778.png"
                },
                {
                    name: "Yafa Cafe",
                    desc: "Yemeni coffee and exceptional brunch options nearby.",
                    url: "https://www.yafacafe.com/",
                    originalPhoto: "images/yafa_cafe_1774058372442.png"
                }
            ]
        },
        {
            time: "12:30 PM",
            title: "Art & Anime Culture",
            description: "Explore the aesthetic and maker culture of the campus, hunting for manga and experiencing authentic Japanese marketplaces.",
            places: [
                {
                    name: "Japan Village",
                    desc: "A sprawling marketplace that feels like an authentic slice of Tokyo.",
                    url: "https://www.japanvillage.com/",
                    originalPhoto: "images/japan_village_1774058396451.png"
                },
                {
                    name: "BOOKOFF",
                    desc: "Incredible anime treasure trove and secondhand Japanese goods.",
                    url: "https://www.bookoffusa.com/",
                    originalPhoto: "images/bookoff_1774058409293.png"
                }
            ]
        },
        {
            time: "2:00 PM",
            title: "High-Protein Hidden Gems",
            description: "Skip the expensive indoor lines and grab an affordable, highly-rated lunch from Sunset Park's diverse culinary scene.",
            places: [
                {
                    name: "Tacos El Bronco",
                    desc: "Authentic Mexican tacos to hit those protein goals.",
                    url: "https://tacoselbronco.net/",
                    originalPhoto: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=800&q=80"
                },
                {
                    name: "Ba Xuyen",
                    desc: "Legendary Banh Mi sandwiches for an active afternoon.",
                    url: "https://www.yelp.com/biz/ba-xuyen-brooklyn",
                    originalPhoto: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=800&q=80"
                }
            ]
        },
        {
            time: "3:30 PM",
            title: "Analog Gaming & Movement",
            description: "High-energy interaction or relaxed strategy with the group. Defuse paint bombs, climb walls, or play board games.",
            places: [
                {
                    name: "Beat The Bomb",
                    desc: "Drops your group into an arcade challenge requiring intense communication.",
                    url: "https://www.beatthebomb.com/",
                    originalPhoto: "images/neon_portal_1774058262693.png"
                },
                {
                    name: "Brooklyn Game Knight",
                    desc: "Settle in for specialized tabletop gaming and drinks.",
                    url: "https://www.brooklyngameknight.com/",
                    originalPhoto: "https://images.unsplash.com/photo-1610813735114-14c1cd84e592?auto=format&fit=crop&w=800&q=80"
                }
            ]
        },
        {
            time: "6:30 PM",
            title: "Dinner & Izakaya",
            description: "Wind down the day with a full meal, comfort food, and premium teas as the courtyards light up.",
            places: [
                {
                    name: "WakuWaku",
                    desc: "Vibrant dining that feels like an immersive set piece.",
                    url: "https://industrycity.com/tenants/wakuwaku/",
                    originalPhoto: "images/abstract_glass_1774058250187.png"
                },
                {
                    name: "Hometown BBQ",
                    desc: "Slow-cooked BBQ for sharing with the group.",
                    url: "https://hometownbbq.com/",
                    originalPhoto: "https://images.unsplash.com/photo-1552611052-33e04de081de?auto=format&fit=crop&w=800&q=80"
                }
            ]
        }
    ];

    const container = document.getElementById('itinerary-list');

    itineraryData.forEach((item, index) => {
        const section = document.createElement('div');
        section.className = 'itinerary-item flex flex-col lg:flex-row gap-8 lg:gap-16 py-16 border-b border-stone-200';
        if (index % 2 !== 0) {
            section.classList.add('lg:flex-row-reverse');
        }
        
        // Calculate dynamic ETA placeholder
        let etaHtml = '';
        if (index > 0) {
            const transitTime = Math.floor(Math.random() * 15) + 10;
            etaHtml = `<div class="inline-flex items-center gap-2 px-3 py-1 mb-6 rounded-full bg-stone-100 text-stone-500 text-xs font-medium tracking-wide">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                ${transitTime} min transit
            </div>`;
        }
        
        const placesHtml = item.places.map(place => `
            <div class="venue-card mt-6 bg-white p-6 rounded-xl shadow-sm border border-stone-100 hover:shadow-md hover:-translate-y-1 transition-all duration-300">
                <h3 class="text-xl font-bold mb-2 text-stone-800">${place.name}</h3>
                <p class="text-sm text-stone-600 mb-4">${place.desc}</p>
                <div class="aspect-[4/3] w-full mb-4 overflow-hidden rounded-lg">
                    <img src="${place.originalPhoto}" alt="${place.name}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-700">
                </div>
                <a href="${place.url}" target="_blank" class="text-xs font-semibold uppercase tracking-wider text-orange-600 hover:text-orange-800 transition-colors inline-flex items-center gap-1">Visit Venue &rarr;</a>
            </div>
        `).join('');

        section.innerHTML = `
            <div class="item-content section-text flex-1">
                ${etaHtml}
                <span class="time font-semibold text-orange-600 tracking-widest text-sm uppercase mb-3 block">${item.time}</span>
                <h2 class="text-4xl lg:text-5xl font-serif font-bold text-stone-900 mb-6 leading-tight">${item.title}</h2>
                <p class="text-stone-500 text-lg leading-relaxed mb-8 max-w-xl">${item.description}</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative">
                    ${placesHtml}
                </div>
            </div>
        `;
        
        container.appendChild(section);
    });

    window.onload = () => {
        const tl = gsap.timeline();
        
        // Initial scatter entrance
        const heroImages = gsap.utils.toArray('.hero-float-img');
        tl.from(heroImages, {
            y: 100,
            opacity: 0,
            scale: 0.8,
            rotation: () => gsap.utils.random(-15, 15),
            duration: 1.5,
            stagger: 0.1,
            ease: "back.out(1.2)"
        }, "-=1");

        // Advanced ScrollTrigger Parallax
        heroImages.forEach(img => {
            const speed = parseFloat(img.getAttribute('data-speed'));
            gsap.to(img, {
                y: () => -window.innerHeight * speed * 0.4,
                rotation: () => gsap.utils.random(-8, 8),
                ease: "none",
                scrollTrigger: {
                    trigger: "#hero",
                    start: "top top",
                    end: "bottom -100%",
                    scrub: 1
                }
            });
        });

        // 3D Mouse Tracking for Sacred Heart & Floating Images
        const heartEl = document.getElementById('sacred-heart-container');
        if (window.matchMedia("(min-width: 768px)").matches) {
            document.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth - 0.5) * 40;
                const y = (e.clientY / window.innerHeight - 0.5) * 40;
                
                // Track Heros
                gsap.to(heroImages, {
                    x: (i, el) => x * parseFloat(el.getAttribute('data-speed')),
                    y: (i, el) => y * parseFloat(el.getAttribute('data-speed')),
                    ease: "power2.out",
                    duration: 1.5
                });

                if(!heartEl) return;
                const rect = heartEl.getBoundingClientRect();
                const hX = e.clientX - (rect.left + rect.width / 2);
                const hY = e.clientY - (rect.top + rect.height / 2);
                
                // Tilt rotation limits
                const rotateY = (hX / window.innerWidth) * 50; 
                const rotateX = -(hY / window.innerHeight) * 50;
                
                heartEl.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            // Reset on leave
            document.addEventListener('mouseleave', () => {
                if(heartEl) heartEl.style.transform = `rotateX(0deg) rotateY(0deg)`;
            });
        }

        // Scroll Triggers for Elements
        gsap.utils.toArray('.itinerary-item').forEach((section) => {
            gsap.from(section, {
                scrollTrigger: {
                    trigger: section,
                    start: "top 80%",
                    toggleActions: "play none none reverse"
                },
                y: 50,
                opacity: 0,
                duration: 1,
                ease: "power3.out"
            });
        });

        // Surprise Memo
        gsap.to("#surprise-img", {
            scrollTrigger: {
                trigger: "#surprise-section",
                start: "top center",
                end: "bottom bottom",
                scrub: 1
            },
            opacity: 1,
            scale: 1.1,
            ease: "none"
        });
    };
</script>
</body>
</html>
