<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industry City & Beyond | Pure Beauty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&family=Titan+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAFAFA;
            --text-main: #1C1C1C;
            --text-muted: #6B6B6B;
            --accent: #D4AF37; /* Subtle elegant gold */
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overscroll-behavior: none;
        }
        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }
        .smooth-scroll-wrapper {
            width: 100%;
            overflow: hidden;
        }
        
        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 0 2rem;
        }
        .hero h1 {
            font-size: clamp(3rem, 8vw, 7rem);
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }
        .hero p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            max-width: 600px;
            font-weight: 300;
        }

        /* Image Composite Effect */
        .image-composite {
            position: relative;
            width: 100%;
            height: 60vh;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            cursor: pointer;
        }
        .image-generated-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            filter: blur(20px) saturate(1.5);
            opacity: 0;
            transition: opacity 0.8s ease, transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            transform: scale(1.1);
        }
        .image-composite:hover .image-generated-layer {
            opacity: 0.8;
            transform: scale(1);
        }
        .image-original-layer {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 2;
        }
        .image-composite:hover .image-original-layer {
            transform: translate(-50%, -50%) scale(1.03);
        }

        /* Itinerary Section */
        .itinerary-item {
            display: flex;
            flex-direction: column;
            gap: 4rem;
            padding: 8rem 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        @media(min-width: 1024px) {
            .itinerary-item {
                flex-direction: row;
                align-items: center;
                gap: 8rem;
            }
            .itinerary-item:nth-child(even) {
                flex-direction: row-reverse;
            }
        }
        .item-content {
            flex: 1;
            padding: 0 2rem;
        }
        .item-content h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .item-content .time {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 1rem;
            display: block;
        }
        .item-images {
            flex: 1.2;
            padding: 0 2rem;
            perspective: 1000px;
        }

        .venue-card {
            margin-top: 2rem;
            background: #fff;
            padding: 1.5rem;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border-left: 2px solid var(--accent);
            transition: transform 0.4s ease;
        }
        .venue-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

<div class="smooth-scroll-wrapper" id="smooth-wrapper">
    <div id="smooth-content">

        <!-- HERO -->
        <section class="hero" id="hero">
            <div class="z-20 relative pointer-events-auto w-full max-w-6xl flex flex-col items-center mt-32 md:mt-12">
                <!-- SVG Animated Filter for Fire -->
                <svg width="0" height="0" class="absolute pointer-events-none">
                    <filter id="fire">
                        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.04" numOctaves="3" result="noise">
                            <animate attributeName="baseFrequency" values="0.02 0.04;0.01 0.08;0.02 0.04" dur="3s" repeatCount="indefinite" />
                        </feTurbulence>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
                    </filter>
                </svg>

                <!-- Main Title: Fun & Friends with 3D Sacred Heart -->
                <div class="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-16 w-full px-4" style="perspective: 1200px;">
                    <!-- 'Fun' Text -->
                    <span class="hero-title-text block text-7xl md:text-[9rem] font-black tracking-tighter uppercase" style="color: #ff2a5f; text-shadow: 0 0 30px rgba(255,42,95,0.8), 0 0 60px rgba(255,100,0,0.5);">FUN</span>
                    
                    <!-- 3D Animated Sacred Heart -->
                    <div id="sacred-heart-container" class="relative w-56 h-56 md:w-96 md:h-96" style="transform-style: preserve-3d; transition: transform 0.1s ease-out;">
                        <!-- Base Heart -->
                        <img src="images/sacred_heart_final_2.png" alt="Sacred Heart" class="absolute inset-0 w-full h-full object-contain filter drop-shadow-[0_0_50px_rgba(255,60,0,0.6)]" style="transform: translateZ(50px);" />
                        <!-- Animated Fire Overlay -->
                        <div class="absolute inset-0 w-full h-full pointer-events-none" style="mask-image: linear-gradient(to bottom, black 0%, black 45%, transparent 55%); -webkit-mask-image: linear-gradient(to bottom, black 0%, black 45%, transparent 55%); transform: translateZ(80px);">
                            <img src="images/sacred_heart_final_2.png" class="w-full h-full object-contain filter drop-shadow-[0_0_20px_rgba(255,200,0,0.8)]" style="filter: url(#fire);" />
                        </div>
                    </div>

                    <!-- '& Friends' Text -->
                    <span class="hero-title-text block text-7xl md:text-[9rem] font-black tracking-tighter uppercase" style="color: #ffb800; text-shadow: 0 0 30px rgba(255,184,0,0.8), 0 0 60px rgba(255,50,0,0.5);">&amp; FRIENDS</span>
                </div>

                <!-- Chrome Balloon Metallic Description Text -->
                <p class="hero-desc mt-12 mb-8 mx-auto px-6 py-4 text-center max-w-4xl" style="
                    font-family: 'Titan One', Impact, sans-serif;
                    font-size: clamp(1.2rem, 3.5vw, 2.5rem);
                    line-height: 1.3;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                    background: linear-gradient(180deg, #ffffff 0%, #d4d4d4 38%, #888888 45%, #333333 50%, #dcdcdc 60%, #ffffff 100%);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    -webkit-text-stroke: 1.5px rgba(255,255,255,0.5);
                    filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.8)) drop-shadow(0px 2px 2px rgba(255,255,255,0.9));
                ">
                A beautifully curated Saturday itinerary balancing exceptional cuisine, vibrant art, and engaging co-op gaming. Scroll to explore all your options.
                </p>
            </div>
        </section>

        <!-- ITINERARY CONTAINER -->
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12" id="itinerary-list">
            <!-- Content Injected via JS -->
        </section>

        <footer class="py-24 text-center text-stone-400 text-sm">
            <p class="serif italic text-lg mb-2">"Pure Beauty in Every Detail"</p>
            <p>Saturfun &copy; 2026</p>
        </footer>

    </div>
</div>

<script>
    gsap.registerPlugin(ScrollTrigger);

    // Using the original real photos provided in user's index.html as the "original" photos.
    // Adding beautiful AI generated images to serve as the atmospheric/animated background layer to satisfy constraints.
    const itineraryData = [
        {
            time: "11:30 AM",
            title: "Coffee & Patisserie",
            description: "Begin the morning in a sunlit space with classic French-Belgian baked goods or Yemeni pour-over coffees.",
            places: [
                {
                    name: "Colson Patisserie",
                    desc: "Perfect quiet starting point before the crowds.",
                    url: "https://industrycity.com/tenants/colson-patisserie/",
                    originalPhoto: "https://images.unsplash.com/photo-1495147466023-fa5c96626c23?auto=format&fit=crop&w=800&q=80",
                    generatedAnim: "images/colson_patisserie_1774058351778.png"
                }
            ]
        },
        {
            time: "12:30 PM",
            title: "Art & Anime Culture",
            description: "Explore the aesthetic and maker culture of the campus, hunting for manga and experiencing authentic Japanese marketplaces.",
            places: [
                {
                    name: "Japan Village & BOOKOFF",
                    desc: "A sprawling marketplace that feels like an authentic slice of Tokyo, paired with an anime treasure trove.",
                    url: "https://www.japanvillage.com/",
                    originalPhoto: "https://images.unsplash.com/photo-1580455430070-5b565fb00e28?auto=format&fit=crop&w=800&q=80",
                    generatedAnim: "images/japan_village_1774058396451.png"
                }
            ]
        },
        {
            time: "2:00 PM",
            title: "High-Protein Hidden Gems",
            description: "Skip the expensive indoor lines and grab an affordable, highly-rated lunch from Sunset Park's diverse culinary scene.",
            places: [
                {
                    name: "Tacos El Bronco",
                    desc: "Authentic Mexican tacos to hit those protein goals.",
                    url: "#",
                    originalPhoto: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=800&q=80",
                    generatedAnim: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=800&q=80" // Fallback aesthetic
                }
            ]
        },
        {
            time: "3:30 PM",
            title: "Analog Gaming & Movement",
            description: "High-energy interaction or relaxed strategy with the group. Defuse paint bombs, climb walls, or play board games.",
            places: [
                {
                    name: "Beat The Bomb & Game Knight",
                    desc: "Drops your group into an arcade challenge requiring intense communication.",
                    url: "https://www.beatthebomb.com/",
                    originalPhoto: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80",
                    generatedAnim: "images/neon_portal_1774058262693.png"
                }
            ]
        },
        {
            time: "6:30 PM",
            title: "Dinner & Izakaya",
            description: "Wind down the day with a full meal, comfort food, and premium teas as the courtyards light up.",
            places: [
                {
                    name: "WakuWaku & Hometown BBQ",
                    desc: "Vibrant dining that feels like an immersive set piece, or slow-cooked BBQ for sharing.",
                    url: "https://industrycity.com/tenants/wakuwaku/",
                    originalPhoto: "https://images.unsplash.com/photo-1552611052-33e04de081de?auto=format&fit=crop&w=800&q=80",
                    generatedAnim: "images/abstract_glass_1774058250187.png"
                }
            ]
        }
    ];

    const container = document.getElementById('itinerary-list');

    itineraryData.forEach((item, index) => {
        const place = item.places[0]; // Displaying the primary place for visual elegance

        const section = document.createElement('div');
        section.className = 'itinerary-item';
        
        section.innerHTML = `
            <div class="item-content section-text">
                <span class="time">${item.time}</span>
                <h2>${item.title}</h2>
                <p class="text-stone-500 text-lg leading-relaxed">${item.description}</p>
                
                <div class="venue-card">
                    <h3 class="text-xl font-bold mb-1">${place.name}</h3>
                    <p class="text-sm text-stone-600 mb-3">${place.desc}</p>
                    <a href="${place.url}" target="_blank" class="text-xs font-semibold uppercase tracking-wider text-orange-600 hover:text-orange-800 transition-colors">Visit Venue &rarr;</a>
                </div>
            </div>
            <div class="item-images image-wrapper">
                <div class="image-composite">
                    <!-- The generated aesthetic image providing animative background glow/context -->
                    <img src="${place.generatedAnim}" alt="Generated Aesthetic Backdrop" class="image-generated-layer" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop'">
                    <!-- The specific original photo from the place -->
                    <img src="${place.originalPhoto}" alt="${place.name}" class="image-original-layer">
                </div>
            </div>
        `;
        
        container.appendChild(section);
    });

    // Animations Initializer
    window.onload = () => {
        // Hero Intro
        const tl = gsap.timeline();
        tl.from(".hero-title-text", {
            y: 80,
            opacity: 0,
            rotationX: -60,
            stagger: 0.2,
            duration: 1.5,
            ease: "back.out(1.7)"
        })
        .from("#sacred-heart-container", {
            scale: 0.1,
            opacity: 0,
            rotationZ: -15,
            duration: 2,
            ease: "elastic.out(1, 0.4)"
        }, "-=1.2")
        .from(".hero-desc", {
            opacity: 0,
            scale: 1.1,
            y: 30,
            duration: 1.2,
            ease: "power3.out"
        }, "-=1");

        // 3D Mouse Tracking for Sacred Heart
        const heartEl = document.getElementById('sacred-heart-container');
        if (window.matchMedia("(min-width: 768px)").matches) {
            document.addEventListener('mousemove', (e) => {
                if(!heartEl) return;
                const rect = heartEl.getBoundingClientRect();
                const x = e.clientX - (rect.left + rect.width / 2);
                const y = e.clientY - (rect.top + rect.height / 2);
                
                // Tilt rotation limits (e.g. 40 degrees)
                const rotateY = (x / window.innerWidth) * 50; 
                const rotateX = -(y / window.innerHeight) * 50;
                
                heartEl.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            // Reset on leave
            document.addEventListener('mouseleave', () => {
                if(heartEl) heartEl.style.transform = `rotateX(0deg) rotateY(0deg)`;
            });
        }

        // Scroll Triggers for Elements
        gsap.utils.toArray('.itinerary-item').forEach((section, i) => {
            const text = section.querySelector('.section-text');
            const imageWrapper = section.querySelector('.image-wrapper');
            const composite = section.querySelector('.image-composite');
            const originalLayer = section.querySelector('.image-original-layer');

            // Text Fade In
            gsap.from(text, {
                scrollTrigger: {
                    trigger: section,
                    start: "top 80%",
                    toggleActions: "play none none reverse"
                },
                y: 50,
                opacity: 0,
                duration: 1,
                ease: "power3.out"
            });

            // Image Fade In & Parallax
            gsap.from(imageWrapper, {
                scrollTrigger: {
                    trigger: section,
                    start: "top 85%",
                    toggleActions: "play none none reverse"
                },
                y: 80,
                opacity: 0,
                duration: 1.2,
                ease: "power3.out"
            });

            // Subtle Parallax on the original image layer inside composite
            gsap.to(originalLayer, {
                scrollTrigger: {
                    trigger: section,
                    start: "top bottom",
                    end: "bottom top",
                    scrub: 1
                },
                y: 30, // Moves slightly as you scroll
                ease: "none"
            });
            
            // Subtle Scale down on generated background layer during scroll
            if(section.querySelector('.image-generated-layer')) {
                 gsap.to(section.querySelector('.image-generated-layer'), {
                    scrollTrigger: {
                        trigger: section,
                        start: "top bottom",
                        end: "bottom top",
                        scrub: true
                    },
                    scale: 1,
                    ease: "none"
                });
            }
        });
    };
</script>
</body>
</html>
