<!DOCTYPE html>
<html lang="en">

    <style>
        :root {
            --bg-color: #FAFAFA;
            --text-main: #1C1C1C;
            --text-muted: #6B6B6B;
            --accent: #D4AF37;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overscroll-behavior: none;
        }
        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }
        
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 2rem;
            position: relative;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('images/cosmic_hero_1774058238009.png');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: -1;
            filter: grayscale(80%) contrast(1.2);
        }

        .hero h1 {
            font-size: clamp(3.5rem, 8vw, 7rem);
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        .hero p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            max-width: 600px;
            font-weight: 300;
        }

        .itinerary-item {
            padding: 8rem 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        
        .item-content {
            padding: 0 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .item-content h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .time-badge {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 1rem;
            display: inline-block;
            font-weight: 600;
        }

        .options-scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 2.5rem;
            padding: 3rem 2rem;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            max-width: 1400px;
            margin: 0 auto;
        }
        .options-scroll-container::-webkit-scrollbar {
            height: 6px;
        }
        .options-scroll-container::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .options-scroll-container::-webkit-scrollbar-thumb {
            background: #d4d4d4; 
            border-radius: 4px;
        }

        .option-card {
            flex: 0 0 auto;
            width: 380px;
            display: flex;
            flex-direction: column;
        }

        .image-composite {
            position: relative;
            width: 100%;
            height: 480px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            cursor: pointer;
            background: #f0f0f0;
            margin-bottom: 1.5rem;
        }

        .eta-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(28, 28, 28, 0.85);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 10;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .image-generated-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            filter: blur(15px) saturate(1.2);
            opacity: 0;
            transition: opacity 0.8s ease, transform 1.2s ease;
            transform: scale(1.1);
        }
        
        .image-composite:hover .image-generated-layer {
            opacity: 0.9;
            transform: scale(1);
            filter: blur(5px) saturate(1.3);
        }

        .image-original-layer {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 88%;
            height: 88%;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 2;
        }
        
        .image-composite:hover .image-original-layer {
            transform: translate(-50%, -50%) scale(1.04);
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }
        
        @media (max-width: 768px) {
            .option-card { width: 300px; }
            .image-composite { height: 380px; }
            .item-content h2 { font-size: 2.2rem; }
        }

</head>

    const container = document.getElementById('itinerary-list');

    itineraryData.forEach((item, index) => {
        const section = document.createElement('div');
        section.className = 'itinerary-item bg-white';
        
        let optionsHtml = '';
        item.places.forEach(place => {
            optionsHtml += `
                <div class="option-card">
                    <div class="image-composite">
                        <div class="eta-badge">${place.eta}</div>
                        <!-- Generated Artwork background -->
                        <img src="${place.generatedAnim}" alt="Generated Aesthetic Backdrop" class="image-generated-layer" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop'">
                        <!-- Original specific photo -->
                        <img src="${place.originalPhoto}" alt="${place.name}" class="image-original-layer" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1495147466023-fa5c96626c23?auto=format&fit=crop&w=800&q=80'">
                    </div>
                    <div class="px-2">
                        <h3 class="text-2xl font-bold mb-2 text-stone-900">${place.name}</h3>
                        <p class="text-sm text-stone-600 mb-4 leading-relaxed">${place.desc}</p>
                        <a href="${place.url}" target="_blank" class="text-xs font-bold uppercase tracking-widest text-orange-600 hover:text-orange-800 transition-colors inline-block border-b-2 border-orange-200 hover:border-orange-500 pb-1">View Details / Maps &rarr;</a>
                    </div>
                </div>
            `;
        });

        section.innerHTML = `
            <div class="item-content section-text">
                <span class="time-badge">${item.time}</span>
                <h2>${item.title}</h2>
                <p class="text-stone-500 text-lg leading-relaxed max-w-3xl">${item.description}</p>
            </div>
            <div class="options-scroll-container">
                ${optionsHtml}
            </div>
        `;
        
        container.appendChild(section);
    });

    window.onload = () => {
        // Hero Intro
        const tl = gsap.timeline();
        tl.from(".hero-text", {
            y: 50,
            opacity: 0,
            rotationX: -30,
            stagger: 0.2,
            duration: 1.2,
            ease: "back.out(1.4)"
        })
        .from("#sacred-heart-container", {
            scale: 0.1,
            opacity: 0,
            rotationZ: -10,
            duration: 1.5,
            ease: "elastic.out(1, 0.4)"
        }, "-=1.0");

        // 3D Mouse Tracking for Sacred Heart (Restored perfectly)
        const heartEl = document.getElementById('sacred-heart-container');
        if (window.matchMedia("(min-width: 768px)").matches) {
            document.addEventListener('mousemove', (e) => {
                if(!heartEl) return;
                const rect = heartEl.getBoundingClientRect();
                const hX = e.clientX - (rect.left + rect.width / 2);
                const hY = e.clientY - (rect.top + rect.height / 2);
                const rotateY = (hX / window.innerWidth) * 50; 
                const rotateX = -(hY / window.innerHeight) * 50;
                heartEl.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            document.addEventListener('mouseleave', () => {
                if(heartEl) heartEl.style.transform = `rotateX(0deg) rotateY(0deg)`;
            });
        }

        // NEW CODE FOR PARALLAX HERO FLOAT
        const heroImages = gsap.utils.toArray('.hero-float-img');
        
        // Initial scatter entrance
        tl.from(heroImages, {
            y: 100,
            opacity: 0,
            scale: 0.8,
            rotation: () => gsap.utils.random(-15, 15),
            duration: 1.5,
            stagger: 0.1,
            ease: "back.out(1.2)"
        }, "-=0.8");

        // Advanced ScrollTrigger Parallax
        heroImages.forEach(img => {
            const speed = parseFloat(img.getAttribute('data-speed'));
            gsap.to(img, {
                y: () => -window.innerHeight * speed * 0.4,
                rotation: () => gsap.utils.random(-8, 8),
                ease: "none",
                scrollTrigger: {
                    trigger: "#hero",
                    start: "top top",
                    end: "bottom -100%",
                    scrub: 1
                }
            });
        });

        // Elegant Magnetic Mouse Hover (Desktop Only)
        if (window.matchMedia("(min-width: 768px)").matches) {
            document.addEventListener('mousemove', e => {
                const x = (e.clientX / window.innerWidth - 0.5) * 40;
                const y = (e.clientY / window.innerHeight - 0.5) * 40;
                gsap.to(heroImages, {
                    x: (i, el) => x * parseFloat(el.getAttribute('data-speed')),
                    y: (i, el) => y * parseFloat(el.getAttribute('data-speed')),
                    ease: "power2.out",
                    duration: 1.5
                });
            });
        }

        // SURPRISE SECTION LOGIC
        const surpriseTl = gsap.timeline({
            scrollTrigger: {
                trigger: "#surprise-section",
                start: "top center",
                end: "center center",
                scrub: 1
            }
        });
        
        surpriseTl.to("#surprise-text", { y: -50, opacity: 0.1, duration: 1 })
                  .to("#surprise-subtext", { y: -30, opacity: 0.05, duration: 1 }, "<")
                  .to("#surprise-meme", {
                      y: 0,
                      opacity: 1,
                      scale: 1,
                      rotation: 3,
                      duration: 2,
                      ease: "power3.out"
                  }, "-=0.5");

        // Existing Scroll Triggers for Elements
        gsap.utils.toArray('.itinerary-item').forEach((section, i) => {
            const text = section.querySelector('.section-text');
            const bgImage = section.querySelectorAll('.image-original-layer');

            gsap.from(text, {
                scrollTrigger: {
                    trigger: section,
                    start: "top 80%",
                    toggleActions: "play none none reverse"
                },
                y: 30,
                opacity: 0,
                duration: 1,
                ease: "power3.out"
            });

            // Parallax on original images inside scroll container
            bgImage.forEach(img => {
                gsap.to(img, {
                    scrollTrigger: {
                        trigger: section,
                        start: "top bottom",
                        end: "bottom top",
                        scrub: 1
                    },
                    y: 15,
                    ease: "none"
                });
            });
        });
    };
</script>
</body>
</html>
