#:schema node_modules/wrangler/config-schema.json
# Saturfun visitor-mode chat fallback Worker.
# Fronts CF Workers AI (@cf/meta/llama-3.3-70b-instruct-fp8-fast) for browsers
# without WebGPU. Free-tier only — see README.md.

name = "saturfun-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# ---- Workers AI binding ---------------------------------------------------
# Exposes `env.AI.run(...)`. No additional config required.
[ai]
binding = "AI"

# ---- KV namespace for the per-IP sliding-window rate limiter -------------
# Create the namespaces (one for production, one for `wrangler dev`):
#   wrangler kv namespace create RATE_LIMIT
#   wrangler kv namespace create RATE_LIMIT --preview
# Then paste the returned `id` and `preview_id` below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "1577fae17462426582ffc7512460ad27"
preview_id = "91b30d15096e439d875bb1c8218d64e4"

# ---- Vars ----------------------------------------------------------------
# Tunable knobs. Override per-environment with `[env.<name>.vars]` if needed.
[vars]
# Sliding-window: max requests per IP within RATE_WINDOW_SECONDS.
RATE_LIMIT_MAX = "10"
RATE_WINDOW_SECONDS = "60"
# Hard ceiling per generated response (caps worst-case neuron spend).
MAX_TOKENS = "800"
# Comma-separated CORS origins. Append your own preview/prod origins as needed.
ALLOWED_ORIGINS = "https://javendean.github.io,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5599,http://localhost:5599"
# ---- Photo wall knobs ----------------------------------------------------
# Hard per-file upload cap (the endpoint is public). Magic-byte validated.
PHOTO_MAX_MB = "25"
# Total R2 budget for ALL photos combined — disk-fill guardrail (-> 507).
# 9 GB stays under R2's free 10 GB tier; raise (and accept ~$0.015/GB/mo) for more.
PHOTO_MAX_TOTAL_GB = "9"
# Anti-amplification + isolate-OOM safety. Per request: max files (<=24 keeps the
# free-tier 50-subrequest budget) and max body before buffering. 50 MB keeps peak
# isolate memory safe (<128 MB); the frontend batches big dumps into many such requests.
PHOTO_MAX_FILES_PER_REQUEST = "20"
PHOTO_MAX_REQUEST_MB = "50"
# Upload gets its own (higher) per-IP rate limit + counter, so bulk batches flow
# without competing with the chat limiter (RATE_LIMIT_MAX). Window = RATE_WINDOW_SECONDS.
PHOTO_RATE_LIMIT_MAX = "60"
# NOTE: PHOTO_OWNER_TOKEN is a SECRET, not a var. Set it with:
#   wrangler secret put PHOTO_OWNER_TOKEN
# DELETE is gated by it and fails closed when unset.
# Web Push (VAPID): public key + subject are non-sensitive vars; the PRIVATE key is a
# secret (wrangler secret put VAPID_PRIVATE_KEY — the P-256 private JWK JSON).
VAPID_PUBLIC_KEY = "BGRu2bIRZcfaSYd2A45hs7cTDYwKjOOT-90ZZ9CKpKv8r5l64vAeU-zn85tott6CWoJIiVJ_f4a5Wc1Pi7zijMM"
VAPID_SUBJECT = "mailto:javendeannaipaul@gmail.com"

# ---- R2 bucket: photo bytes (originals + optional thumbs) ----------------
# Create it once:  wrangler r2 bucket create saturfun-photos
# Local `wrangler dev` + vitest use an isolated local bucket keyed by binding.
[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "saturfun-photos"

# ---- D1 database: photo metadata (bytes live in R2) ----------------------
# Create it once:  wrangler d1 create saturfun-db   (prints the real database_id)
# The placeholder id below is fine for LOCAL dev/test (miniflare ignores it);
# paste the real UUID before `wrangler deploy` + `wrangler d1 migrations apply --remote`.
[[d1_databases]]
binding = "DB"
database_name = "saturfun-db"
database_id = "45d2081f-bcfe-47f4-aed3-1ab15a31e7f6"
migrations_dir = "migrations"

# ---- Observability -------------------------------------------------------
[observability]
enabled = true
